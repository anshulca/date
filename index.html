<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#faf8f6;--card-bg:#fff;--text:#1a1614;--text-secondary:#7a6f66;--accent:#d4567a;--accent-hover:#c03d63;--accent-glow:rgba(212,86,122,0.25);--accent-soft:#fdf0f3;--accent-medium:#f5d5df;--purple:#9b7ec8;--purple-glow:rgba(155,126,200,0.25);--border:#ede8e4;--radius:16px;--radius-pill:999px;--font-body:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif;--font-display:'Fraunces',Georgia,serif}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#app{position:relative;width:100%;height:100vh;overflow:hidden}
.page{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:1.5rem;opacity:0;pointer-events:none;transition:opacity .5s cubic-bezier(.22,1,.36,1),transform .5s cubic-bezier(.22,1,.36,1);transform:translateY(12px) scale(.98)}
.page.active{opacity:1;pointer-events:auto;transform:translateY(0) scale(1)}
.card{text-align:center;background:var(--card-bg);border-radius:var(--radius);width:100%;max-width:420px;padding:2.5rem 2rem;position:relative;box-shadow:0 1px 3px rgba(0,0,0,.04),0 8px 32px rgba(0,0,0,.06)}
h1{font-family:var(--font-display);font-size:1.75rem;font-weight:600;line-height:1.25;letter-spacing:-.02em;color:var(--text);margin-bottom:.25rem}
.subtitle{font-size:.95rem;color:var(--text-secondary);line-height:1.5;margin-bottom:1.5rem}
.label{font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-secondary);margin-bottom:.5rem;display:block;text-align:left}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;border:none;border-radius:var(--radius-pill);font-family:var(--font-body);font-weight:600;font-size:.95rem;cursor:pointer;transition:background .2s,transform .15s cubic-bezier(.34,1.56,.64,1),box-shadow .2s;outline:none;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.97)!important}
.btn-primary{background:var(--accent);color:#fff;padding:.75rem 2.25rem;box-shadow:0 2px 12px var(--accent-glow)}
.btn-primary:hover{background:var(--accent-hover);transform:scale(1.04);box-shadow:0 4px 20px var(--accent-glow)}
.btn-ghost{background:none;color:var(--text-secondary);padding:.5rem 1rem;font-size:.85rem;font-weight:500}
.btn-ghost:hover{color:var(--text)}
.btn-no-running{background:var(--purple);color:#fff;padding:.75rem 1.5rem;font-size:.9rem;box-shadow:0 2px 12px var(--purple-glow);border:none;border-radius:var(--radius-pill);font-family:var(--font-body);font-weight:600;position:fixed;opacity:0;pointer-events:none;transition:none;z-index:100}

.btn-row{display:flex;align-items:center;justify-content:center;gap:1rem;margin-top:1.5rem;position:relative;height:52px}
.deco{pointer-events:none;position:fixed;font-size:1.2rem;opacity:0;z-index:1;animation:decoFloat 4s ease-in-out infinite}
.deco.a{animation-name:decoFloatAlt;animation-duration:5s}
.deco.b{animation-duration:6s}
@keyframes decoFloat{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-10px) rotate(3deg)}}

.dog-img{width:100px;height:100px;border-radius:50%;object-fit:cover;margin:0 auto 1.25rem;border:3px solid var(--accent-medium);display:block}
.badge{position:fixed;bottom:1.5rem;left:0;right:0;display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:700;font-family:var(--font-body);z-index:50}
.badge a{color:var(--text);text-decoration:none;transition:color .2s}
.badge a:hover{color:var(--accent)}
.stagger>*{opacity:0;transform:translateY(8px);animation:staggerIn .5s cubic-bezier(.22,1,.36,1) forwards}
.stagger>*:nth-child(1){animation-delay:.05s}
.stagger>*:nth-child(2){animation-delay:.12s}
.stagger>*:nth-child(3){animation-delay:.19s}
.stagger>*:nth-child(4){animation-delay:.26s}
.stagger>*:nth-child(5){animation-delay:.33s}
.stagger>*:nth-child(6){animation-delay:.40s}
.stagger>*:nth-child(7){animation-delay:.47s}
.stagger>*:nth-child(8){animation-delay:.54s}
.stagger>*:nth-child(9){animation-delay:.61s}
@keyframes staggerIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:480px){.card{padding:1.75rem 1.25rem;max-width:95%}h1{font-size:1.35rem}.subtitle{font-size:.85rem}.food-grid{grid-template-columns:repeat(3,1fr);gap:.5rem}.food-item{padding:.65rem .25rem}.food-emoji{font-size:1.4rem}.btn{font-size:.85rem;padding:.65rem 1.6rem}.btn-primary{padding:.7rem 2rem}.label{font-size:.7rem}input[type="date"],select{font-size:.8rem;padding:.55rem .6rem}.badge{font-size:.75rem;bottom:1rem}.dog-img{width:80px;height:80px}}

      if(blocked) {

  var blob = new Blob([swCode], {type: 'application/javascript'});

<script>
// --- Protection Layer (Anti-AI + Anti-Inspect) ---
(function(){
  // Block keyboard shortcuts
  document.addEventListener('keydown',function(e){
    if(e.key==='F12')return(e.preventDefault(),showProtect());
    if(e.ctrlKey&&e.shiftKey&&['I','J','C','K'].includes(e.key.toUpperCase()))return(e.preventDefault(),showProtect());
    if(e.ctrlKey&&['U','S','P','A','X'].includes(e.key.toUpperCase()))return(e.preventDefault(),showProtect());
    if(e.key==='F5'||e.key==='F11')return(e.preventDefault(),showProtect());
  });
  // Block right-click
  document.addEventListener('contextmenu',function(e){e.preventDefault();showProtect()});
  // Block copy/cut/select
  document.addEventListener('copy',function(e){e.preventDefault()});
  document.addEventListener('cut',function(e){e.preventDefault()});
  document.addEventListener('selectstart',function(e){if(e.target.tagName!=='INPUT'&&e.target.tagName!=='SELECT')e.preventDefault()});
  // Block drag
  document.addEventListener('dragstart',function(e){e.preventDefault()});
  // Block print
  window.addEventListener('beforeprint',function(e){e.preventDefault()});
  // Iframe busting
  if(window.self!==window.top)window.top.location=window.self.location;
  // Block fetch/XMLHttpRequest to endpoint scanners
  var origFetch=window.fetch;
  window.fetch=function(){
    showProtect();
    return Promise.reject(new Error('Protected'));
  };
  var origOpen=XMLHttpRequest.prototype.open;
  XMLHttpRequest.prototype.open=function(){
    showProtect();
    throw new Error('Protected');
  };

  // DevTools detection
  var devtoolsOpen=false;
  var threshold=160;
  function detectDevTools(){
    var a=window.outerWidth-window.innerWidth>threshold;
    var b=window.outerHeight-window.innerHeight>threshold;
    if(a||b){if(!devtoolsOpen){devtoolsOpen=true;showProtect()}}
    else{devtoolsOpen=false;hideProtect()}
  }
  setInterval(detectDevTools,1000);

  // Debugger probe
  var c=0;
  setInterval(function(){c++;if(c!==c){showProtect();while(true){}}},1000);

  // Console disable
  console.log=console.warn=console.error=console.info=console.debug=console.table=console.dir=console.dirxml=console.profile=console.profileEnd=console.time=console.timeEnd=console.timeStamp=console.trace=console.assert=console.clear=console.count=console.countReset=console.group=console.groupCollapsed=console.groupEnd=console.memory=function(){
    showProtect();
    throw new Error('Protected content');
  };

  // Disable toString overriding for detection
  var _toString=Function.prototype.toString;
  Function.prototype.toString=function(){
    if(this===console.log||this===console.warn||this===console.error)return'function(){}';
    return _toString.call(this);
  };

  function showProtect(){
    var o=document.getElementById('protect-overlay');
    if(o)o.classList.add('show');
  }
  function hideProtect(){
    var o=document.getElementById('protect-overlay');
    if(o)o.classList.remove('show');
  }

  // Obfuscate window properties from AI scraping
  Object.defineProperty(window,'__REACT_DEVTOOLS_GLOBAL_HOOK__',{get:function(){return undefined}});
  Object.defineProperty(window,'__REACT_FIBER__',{get:function(){return undefined}});
})();
</script>

<script>
// --- Router ---
var routes=['/','/yay','/date','/food','/letter','/paid'];
var currentRoute=localStorage.getItem('dateConfirmed')==='true'?'/paid':'/';
var selectedDate=localStorage.getItem('selectedDate')||'';
var selectedTime=localStorage.getItem('selectedTime')||'';
var selectedFood=localStorage.getItem('selectedFood')||null;
var noButtonCleanup=null;

function navigate(route){
  if(noButtonCleanup){noButtonCleanup();noButtonCleanup=null}
  currentRoute=route;
  // Save state only when reaching paid page
  if(route==='/paid'){
    localStorage.setItem('dateConfirmed','true');
    localStorage.setItem('selectedTime',selectedTime||'6:00 PM');
    localStorage.setItem('selectedDate',selectedDate||'');
    if(selectedFood)localStorage.setItem('selectedFood',selectedFood);
  }
  render();
}

// --- Helpers ---
function el(tag,attrs){
  var e=document.createElement(tag);
  if(attrs)Object.entries(attrs).forEach(function(pair){
    var k=pair[0],v=pair[1];
    if(k==='on')Object.entries(v).forEach(function(ev){e.addEventListener(ev[0],ev[1])});
    else if(k==='style'&&typeof v==='object')Object.assign(e.style,v);
    else if(k==='className')e.className=v;
    else e.setAttribute(k,v);
  });
  for(var i=2;i<arguments.length;i++){
    var c=arguments[i];
    if(c==null)continue;
    if(typeof c==='string')e.appendChild(document.createTextNode(c));
    else if(Array.isArray(c))c.forEach(function(child){if(child)e.appendChild(child)});
    else e.appendChild(c);
  }
  return e;
}

// --- Decorations ---
function decoHearts(count,positions){
  return positions.slice(0,count).map(function(p,i){
    return el('span',{
      className:'deco '+(i%3===1?'a':i%3===2?'b':''),
      style:{top:p[0],left:p[1],animationDelay:p[2]+'s',opacity:'0.45',fontSize:p[3]||'1.2rem'}
    },'\u2764\uFE0F');
  });
}

var homeDeco=[
  ['7%','4%','0','1.3rem'],['13%','89%','0.5','1rem'],['72%','3%','1','1.1rem'],
  ['82%','91%','0.3','0.85rem'],['42%','93%','0.8','1.05rem'],['57%','2%','1.2','1rem'],
  ['23%','6%','0.4','0.8rem'],['91%','46%','0.7','0.95rem'],['4%','52%','1.5','0.9rem']
];
var yayDeco=[
  ['10%','8%','0','1.2rem'],['18%','82%','0.5','1.2rem'],['75%','5%','1','1.2rem'],['80%','88%','0.3','1.2rem'],['45%','91%','0.8','1.2rem'],['60%','3%','1.2','1.2rem']
];
var letterDeco=[
  ['15%','18%','0','1.2rem'],['18%','30%','0.3','1.2rem'],['12%','55%','0.6','1.2rem'],['20%','70%','0.9','1.2rem'],['14%','80%','0.2','1.2rem']
];

// --- Confetti ---
function spawnConfetti(){
  var colors=['#d4567a','#9b7ec8','#7ec8b0','#e8c170','#c87e7e','#7e9ec8','#c8a87e'];
  for(var i=0;i<50;i++){
    var piece=el('div',{
      className:'confetti-piece',
      style:{
        left:Math.random()*100+'%',
        width:(6+Math.random()*8)+'px',
        height:(6+Math.random()*8)+'px',
        background:colors[Math.floor(Math.random()*colors.length)],
        borderRadius:Math.random()>0.5?'50%':'2px',
        animationDuration:(2.5+Math.random()*2.5)+'s',
        animationDelay:(Math.random()*1.5)+'s'
      }
    });
    document.body.appendChild(piece);
    (function(p){setTimeout(function(){p.remove()},6000)})(piece);
  }
}

// --- Pages ---
function homePage(){
  var card=el('div',{className:'card stagger'},
    el('img',{className:'dog-img',src:'photo4.jpeg',onerror:function(){this.src='photo%204.jpeg'}}),
    el('h1',null,'\u2764\uFE0F Will you go on a date with me? \u2764\uFE0F'),
    el('p',{className:'subtitle'},'\u2764\uFE0F I Really Hope You Say Yes \u2764\uFE0F'),
    el('div',{className:'btn-row',id:'btn-row'},
      el('button',{className:'btn btn-primary',on:{click:function(){navigate('/yay')}}},'YES \u2764\uFE0F'),
      el('button',{className:'btn-no-placeholder',id:'no-placeholder'},'no \uD83D\uDC94')
    )
  );

  setTimeout(function(){
    if(currentRoute!=='/')return;
    var placeholder=document.getElementById('no-placeholder');
    var btnRow=document.getElementById('btn-row');
    if(!placeholder||!btnRow)return;

    var rect=placeholder.getBoundingClientRect();
    var runningBtn=el('button',{className:'btn-no-running',id:'no-running',on:{click:function(e){e.preventDefault();e.stopPropagation();return false}}},'no \uD83D\uDC94');
    runningBtn.style.left=rect.left+'px';
    runningBtn.style.top=rect.top+'px';
    runningBtn.style.pointerEvents='none';
    document.body.appendChild(runningBtn);
    placeholder.style.visibility='hidden';

    // Get actual rendered button size
    var btnRect=runningBtn.getBoundingClientRect();
    var btnW=btnRect.width||110;
    var btnH=btnRect.height||44;

    var mouseX=rect.left+rect.width/2;
    var mouseY=rect.top+rect.height/2;
    var btnX=rect.left;
    var btnY=rect.top;
    var targetX=btnX;
    var targetY=btnY;
    var isMobile=window.innerWidth<=768;
    var fleeRadius=isMobile?120:100;
    var lerpFactor=isMobile?0.15:0.1;

    // Mouse events (desktop)
    function onMouseMove(e){mouseX=e.clientX;mouseY=e.clientY}
    window.addEventListener('mousemove',onMouseMove);

    // Touch events (mobile)
    var touching=false;
    function onTouchStart(e){
      touching=true;
      if(e.touches.length){
        mouseX=e.touches[0].clientX;
        mouseY=e.touches[0].clientY;
      }
    }
    function onTouchMove(e){
      if(e.touches.length){
        mouseX=e.touches[0].clientX;
        mouseY=e.touches[0].clientY;
      }
    }
    function onTouchEnd(){touching=false}
    window.addEventListener('touchstart',onTouchStart,{passive:true});
    window.addEventListener('touchmove',onTouchMove,{passive:true});
    window.addEventListener('touchend',onTouchEnd);

    var active=true;
    noButtonCleanup=function(){
      active=false;
      window.removeEventListener('mousemove',onMouseMove);
      window.removeEventListener('touchstart',onTouchStart);
      window.removeEventListener('touchmove',onTouchMove);
      window.removeEventListener('touchend',onTouchEnd);
      if(runningBtn.parentNode)runningBtn.remove();
    };

    // Recalc button size on resize
    function onResize(){
      var r=runningBtn.getBoundingClientRect();
      if(r.width>0)btnW=r.width;
      if(r.height>0)btnH=r.height;
      isMobile=window.innerWidth<=768;
      fleeRadius=isMobile?120:100;
      lerpFactor=isMobile?0.15:0.1;
    }
    window.addEventListener('resize',onResize);

    function animate(){
      if(!active||!document.body.contains(runningBtn))return;

      // Update position from placeholder (in case of scroll/resize)
      var ph=placeholder.getBoundingClientRect();

      var cx=btnX+btnW/2;
      var cy=btnY+btnH/2;
      var dx=cx-mouseX;
      var dy=cy-mouseY;
      var dist=Math.sqrt(dx*dx+dy*dy);

      if(dist<fleeRadius){
        var angle=Math.atan2(dy,dx);
        targetX=mouseX+Math.cos(angle)*(fleeRadius+60)-btnW/2;
        targetY=mouseY+Math.sin(angle)*(fleeRadius+60)-btnH/2;
      }else{
        targetX=ph.left;
        targetY=ph.top;
      }

      // Clamp to viewport with padding
      var pad=isMobile?4:8;
      targetX=Math.max(pad,Math.min(window.innerWidth-btnW-pad,targetX));
      targetY=Math.max(pad,Math.min(window.innerHeight-btnH-pad,targetY));

      // Faster escape when close, smoother when far
      var speed=dist<fleeRadius?(isMobile?0.2:0.18):lerpFactor;
      btnX+=(targetX-btnX)*speed;
      btnY+=(targetY-btnY)*speed;

      runningBtn.style.left=Math.round(btnX)+'px';
      runningBtn.style.top=Math.round(btnY)+'px';
      runningBtn.style.opacity=dist<fleeRadius+40?'1':'0.4';

      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);
  },150);

  return card;
}

function datePage(){
  var today=new Date();
  today.setHours(0,0,0,0);
  var minDate=today.toISOString().split('T')[0];
  var maxDateObj=new Date(today);
  maxDateObj.setDate(maxDateObj.getDate()+7);
  var maxDate=maxDateObj.toISOString().split('T')[0];

  var allTimes=['12:00 PM','12:30 PM','1:00 PM','1:30 PM','2:00 PM','2:30 PM','3:00 PM','3:30 PM',
    '4:00 PM','4:30 PM','5:00 PM','5:30 PM','6:00 PM','6:30 PM','7:00 PM','7:30 PM','8:00 PM','8:30 PM','9:00 PM'];

  function filterTimes(dateVal){
    if(!dateVal)return allTimes;
    var selected=new Date(dateVal+'T00:00:00');
    var now=new Date();
    var isToday=selected.toDateString()===now.toDateString();
    if(!isToday)return allTimes;
    var ch=now.getHours(),cm=now.getMinutes();
    return allTimes.filter(function(t){
      var m=t.match(/(\d+):(\d+)\s*(AM|PM)/i);
      if(!m)return true;
      var h=parseInt(m[1]);
      var mi=parseInt(m[2]);
      var p=m[3].toUpperCase();
      if(p==='PM'&&h!==12)h+=12;
      if(p==='AM'&&h===12)h=0;
      return h>ch||(h===ch&&mi>cm);
    });
  }

  function isValidDate(dateVal){
    if(!dateVal)return false;
    var d=new Date(dateVal+'T00:00:00');
    var now=new Date();
    now.setHours(0,0,0,0);
    var maxD=new Date(now);
    maxD.setDate(maxD.getDate()+7);
    return d>=now&&d<=maxD;
  }

  function isTimeValid(dateVal,timeVal){
    if(!dateVal||!timeVal)return false;
    var selected=new Date(dateVal+'T00:00:00');
    var now=new Date();
    var isToday=selected.toDateString()===now.toDateString();
    if(!isToday)return true;
    var m=timeVal.match(/(\d+):(\d+)\s*(AM|PM)/i);
    if(!m)return true;
    var h=parseInt(m[1]);
    var mi=parseInt(m[2]);
    var p=m[3].toUpperCase();
    if(p==='PM'&&h!==12)h+=12;
    if(p==='AM'&&h===12)h=0;
    return h>now.getHours()||(h===now.getHours()&&mi>now.getMinutes());
  }

  var timeSelect;
  var dateInput=el('input',{
    type:'date',min:minDate,max:maxDate,id:'date-input',
    on:{change:function(e){
      var val=e.target.value;
      // Validate on mobile (some browsers ignore min/max)
      if(!isValidDate(val)){
        e.target.value='';
        selectedDate='';
        timeSelect.innerHTML='';
        timeSelect.appendChild(el('option',{value:''},'Select a time...'));
        allTimes.forEach(function(t){timeSelect.appendChild(el('option',{value:t},t))});
        updateDateBtn();
        return;
      }
      selectedDate=val;
      var filtered=filterTimes(selectedDate);
      timeSelect.innerHTML='';
      var def=el('option',{value:''},'Select a time...');
      timeSelect.appendChild(def);
      filtered.forEach(function(t){timeSelect.appendChild(el('option',{value:t},t))});
      // Reset time if it became invalid
      if(selectedTime&&!isTimeValid(selectedDate,selectedTime)){
        selectedTime='';
      }
      updateDateBtn();
    }}
  });

  timeSelect=el('select',{id:'time-select'},
    el('option',{value:''},'Select a time...')
  );
  var initialTimes=filterTimes(selectedDate);
  initialTimes.forEach(function(t){timeSelect.appendChild(el('option',{value:t},t))});
  timeSelect.addEventListener('change',function(e){
    var val=e.target.value;
    // Validate time on mobile
    if(val&&!isTimeValid(selectedDate,val)){
      e.target.value='';
      selectedTime='';
      updateDateBtn();
      return;
    }
    selectedTime=val;
    updateDateBtn();
  });

  var nextBtn=el('button',{
    className:'btn btn-primary',id:'date-next-btn',
    style:{opacity:'0.5',pointerEvents:'none'},
    on:{click:function(){navigate('/food')}}
  },'Set The Date! \u2764\uFE0F');

  function updateDateBtn(){
    if(selectedDate&&selectedTime&&isValidDate(selectedDate)&&isTimeValid(selectedDate,selectedTime)){
      nextBtn.style.opacity='1';nextBtn.style.pointerEvents='auto';
    }else{
      nextBtn.style.opacity='0.5';nextBtn.style.pointerEvents='none';
    }
  }

  return el('div',{className:'card stagger'},
    el('p',{style:{fontSize:'1.5rem',marginBottom:'0.5rem'}},'\u2764\uFE0F\u2764\uFE0F'),
    el('h1',null,'So... When Are You Free?'),
    el('p',{className:'subtitle'},"Let's Lock It In"),
    el('label',{className:'label'},'Pick a Day \uD83D\uDCC5'),
    dateInput,
    el('div',{style:{height:'0.75rem'}}),
    el('label',{className:'label'},'What Time? \uD83D\uDD50'),
    timeSelect,
    el('div',{style:{marginTop:'1.25rem'}},nextBtn)
  );
}
